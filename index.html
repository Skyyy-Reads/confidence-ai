<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confidence AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,560;1,9..144,440&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="splash">
  <div class="splash-mark">
    <div class="splash-quad"><span></span><span></span><span></span><span></span></div>
    <div class="splash-word">Confidence AI</div>
  </div>
  <div class="splash-tag">Loading&hellip;</div>
</div>

<div id="root"></div>

<button id="sidebar-toggle" aria-label="Toggle history">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
</button>
<div id="history-overlay"></div>
<div id="history-panel"></div>

<!-- third-party libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- app code, order matters: config/state/auth before views, views before render/handlers/main -->
<script src="js/config.js"></script>
<script src="js/history.js"></script>
<script src="js/state.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/chart.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/auth-views.js"></script>
<script src="js/views/setup.js"></script>
<script src="js/views/quiz.js"></script>
<script src="js/views/results.js"></script>
<script src="js/render.js"></script>
<script src="js/handlers.js"></script>
<script src="js/main.js"></script>
</body>
</html>
